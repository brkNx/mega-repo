name: Smart Contribution
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config user.email "njfv17@gmail.com"
          git config user.name "brkN"
      - name: Create commits
        run: |
          python3 -c "
          import random, subprocess, datetime
          if random.random() < 0.3:
              print('Skip')
              exit(0)
          n = random.randint(1, 3)
          for i in range(n):
              subprocess.run(['git', 'commit', '--allow-empty', '-m', f'Update {datetime.datetime.now().strftime(\"%H:%M\")}'], check=True)
          subprocess.run(['git', 'push'], check=True)
          print(f'Pushed {n} commits')
          "
